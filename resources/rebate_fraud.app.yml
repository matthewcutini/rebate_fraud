resources:
  apps:
    rebate_fraud_app:
      name: ${var.app_name}
      description: Operational rebate investigation workflow
      source_code_path: ../src/app
      lifecycle:
        started: true
      user_api_scopes:
        - sql
        - dashboards.genie
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: Rebate Fraud Executive Analytics
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
