resources:
  jobs:
    rebate_fraud_ai:
      name: ${bundle.target}-rebate-fraud-ai
      performance_target: STANDARD
      tags:
        aidevkit_project: rebate_fraud
      tasks:
        - task_key: release_held_out_month
          notebook_task:
            notebook_path: ../src/data/release_holdout.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.landing_volume}
              period: 2026-10
        - task_key: refresh_pipeline
          depends_on:
            - task_key: release_held_out_month
          pipeline_task:
            pipeline_id: ${resources.pipelines.rebate_fraud_pipeline.id}
            full_refresh: false
        - task_key: score_cases
          depends_on:
            - task_key: refresh_governed_consumption
          sql_task:
            file:
              path: ../src/ai/score.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: refresh_governed_consumption
          depends_on:
            - task_key: refresh_pipeline
          run_job_task:
            job_id: ${resources.jobs.apply_governance.id}
        - task_key: explain_top_cases_v1
          depends_on:
            - task_key: score_cases
          sql_task:
            file:
              path: ../src/ai/explain_v1.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            parameters:
              generator_model: ${var.ai_generator_model}
        - task_key: evaluate_v1
          depends_on:
            - task_key: explain_top_cases_v1
          environment_key: mlflow_environment
          notebook_task:
            notebook_path: ../src/ai/evaluate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              judge_model: ${var.ai_judge_model}
              prompt_version: prompt-v1
        - task_key: explain_top_cases_v2
          depends_on:
            - task_key: evaluate_v1
          sql_task:
            file:
              path: ../src/ai/explain_v2.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            parameters:
              generator_model: ${var.ai_generator_model}
        - task_key: evaluate_v2
          depends_on:
            - task_key: explain_top_cases_v2
          environment_key: mlflow_environment
          notebook_task:
            notebook_path: ../src/ai/evaluate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              judge_model: ${var.ai_judge_model}
              prompt_version: prompt-v2
      environments:
        - environment_key: mlflow_environment
          spec:
            client: "4"
            dependencies:
              - "mlflow[databricks]>=3.16.0"
