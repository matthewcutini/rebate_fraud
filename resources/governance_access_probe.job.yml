resources:
  jobs:
    governance_access_probe:
      name: ${bundle.target}-rebate-fraud-access-probe
      run_as:
        service_principal_name: ${var.governance_test_principal}
      performance_target: STANDARD
      tags:
        aidevkit_project: rebate_fraud
      tasks:
        - task_key: query_permission_probe
          sql_task:
            file:
              path: ../src/governance/access_probe.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
