bundle:
  name: rebate_fraud

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: vandelay
  schema:
    description: Unity Catalog schema
    default: rebate_fraud
  landing_volume:
    description: Managed volume for raw source exports
    default: landing

workspace:
  host: https://8259554820748444.4.gcp.databricks.com

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
