bundle:
  name: rebate_fraud

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: vandelay
  schema:
    description: Unity Catalog schema
    default: rebate_fraud
  landing_volume:
    description: Managed volume for raw source exports
    default: landing
  warehouse_id:
    description: Serverless SQL warehouse used by governance jobs
    default: 5d942ad88a289cf7
  governance_test_principal:
    description: Application ID of the non-admin governance test principal
    default: 961bac9c-adf7-4dab-8197-748a848983ad
  ai_generator_model:
    description: Foundation model endpoint used for structured case explanations
    default: databricks-claude-haiku-4-5
  ai_judge_model:
    description: Different-family foundation model used by MLflow judges
    default: databricks-gpt-5-6-luna

workspace:
  host: https://8259554820748444.4.gcp.databricks.com

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
