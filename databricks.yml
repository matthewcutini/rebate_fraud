bundle:
  name: rebate_fraud

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: vandelay
  schema:
    description: Unity Catalog schema
    default: rebate_fraud
  landing_volume:
    description: Managed volume for raw source exports
    default: landing
  warehouse_id:
    description: Serverless SQL warehouse used by governance jobs
    default: 5d942ad88a289cf7
  governance_test_principal:
    description: Application ID of the non-admin governance test principal
    default: 961bac9c-adf7-4dab-8197-748a848983ad
  ai_generator_model:
    description: Foundation model endpoint used for structured case explanations
    default: databricks-claude-haiku-4-5
  ai_judge_model:
    description: Different-family foundation model used by MLflow judges
    default: databricks-gpt-5-6-luna
  lakebase_project:
    description: Lakebase Postgres Autoscaling project ID
    default: rebate-fraud-ops
  lakebase_branch:
    description: Full Lakebase branch resource name
    default: projects/rebate-fraud-ops/branches/production
  lakebase_database:
    description: Full Lakebase database resource name
    default: projects/rebate-fraud-ops/branches/production/databases/databricks-postgres
  lakebase_database_name:
    description: PostgreSQL database name
    default: databricks_postgres
  lakebase_endpoint:
    description: Full Lakebase endpoint resource name
    default: projects/rebate-fraud-ops/branches/production/endpoints/primary
  app_name:
    description: Workspace-global Databricks App name
    default: rebate-ops-${workspace.current_user.domain_friendly_name}
  genie_space_id:
    description: Governed rebate-fraud Genie space ID
    default: 01f1e3b93f4b11e79b2fbfcd74547821

workspace:
  host: https://8259554820748444.4.gcp.databricks.com

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
